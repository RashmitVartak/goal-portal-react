services:
  - type: web
    name: trackstar
    runtime: python
    buildCommand: |
      cd client && npm install && npm run build && mkdir -p ../server/static && cp -r dist/* ../server/static/ && cd ../server && pip install -r requirements.txt && python -c "from database import init_db, seed_data; init_db(); seed_data()"
    startCommand: cd server && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: NODE_VERSION
        value: 20